<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Terminal chrome bar -->
  <rect x="80" y="60" width="1120" height="36" rx="8" ry="8" fill="#161b22"/>
  <circle cx="104" cy="78" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="124" cy="78" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="144" cy="78" r="6" fill="#22c55e" opacity="0.8"/>
  <text x="640" y="83" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#64748b" text-anchor="middle">visor-tui — Visor Finance</text>

