  <!-- Title overlay -->
  <text x="640" y="610" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="14" fill="#475569" text-anchor="middle" letter-spacing="4">VISOR TUI  ·  TERMINAL UI FOR VISOR FINANCE</text>
