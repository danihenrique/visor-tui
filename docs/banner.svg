  <text x="310" y="556" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#2dd4bf" filter="url(#glow)">[N]</text>
  <text x="340" y="556" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#64748b">Nova</text>
  <text x="400" y="556" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#2dd4bf" filter="url(#glow)">[F]</text>
  <text x="430" y="556" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#64748b">Filtros</text>
  <text x="500" y="556" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#2dd4bf" filter="url(#glow)">[/]</text>
  <text x="530" y="556" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#64748b">Busca</text>
  <text x="590" y="556" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#2dd4bf" filter="url(#glow)">[R]</text>
  <text x="620" y="556" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#64748b">Atualizar</text>
