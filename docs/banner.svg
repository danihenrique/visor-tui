  <text x="440" y="462" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#c9d1d9">Farmácia</text>
  <text x="780" y="462" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#94a3b8">Saúde</text>
  <text x="1020" y="462" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#ef4444" text-anchor="end">- R$ 89,60</text>

