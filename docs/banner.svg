  <text x="100" y="130" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#2dd4bf" filter="url(#glow)">▸ Dashboard</text>
  <text x="100" y="156" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#64748b">  Transações</text>
  <text x="100" y="182" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#64748b">  Categorias</text>
  <text x="100" y="208" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#64748b">  Relatórios</text>
  <text x="100" y="234" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#64748b">  Configurações</text>

